name: atri-games

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: atri-games-api:${ATRI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        GO_VERSION: ${GO_VERSION:-1.26.5}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22}
    environment:
      ATRI_ADDR: :8080
      ATRI_ASSET_ROOT: /assets
      ATRI_AVATAR_MAX_BYTES: ${ATRI_AVATAR_MAX_BYTES:-2097152}
      ATRI_GAME_COVER_MAX_BYTES: ${ATRI_GAME_COVER_MAX_BYTES:-10485760}
      ATRI_GAME_PACKAGE_MAX_BYTES: ${ATRI_GAME_PACKAGE_MAX_BYTES:-536870912}
      ATRI_GAME_PACKAGE_MAX_UNPACKED_BYTES: ${ATRI_GAME_PACKAGE_MAX_UNPACKED_BYTES:-2147483648}
      ATRI_GAME_PACKAGE_MAX_FILES: ${ATRI_GAME_PACKAGE_MAX_FILES:-20000}
      ATRI_PACKAGE_DECRYPTION_PRIVATE_KEY_BASE64: ${ATRI_PACKAGE_DECRYPTION_PRIVATE_KEY_BASE64:-}
      ATRI_GAME_TICKET_TTL_SECONDS: ${ATRI_GAME_TICKET_TTL_SECONDS:-900}
      ATRI_DB_PATH: /data/atri-games.db
      ATRI_JWT_SECRET: ${ATRI_JWT_SECRET:?ATRI_JWT_SECRET must be set}
      ATRI_CORS_ORIGINS: ${ATRI_CORS_ORIGINS:-null}
      ATRI_ADMIN_EMAIL: ${ATRI_ADMIN_EMAIL:-admin@atri.games}
      ATRI_ADMIN_PASSWORD: ${ATRI_ADMIN_PASSWORD:?ATRI_ADMIN_PASSWORD must be set}
      ATRI_OBJECT_STORAGE_PROVIDER: ${ATRI_OBJECT_STORAGE_PROVIDER:-minio}
      ATRI_OBJECT_STORAGE_ENDPOINT: ${ATRI_OBJECT_STORAGE_ENDPOINT:-minio:9000}
      ATRI_OBJECT_STORAGE_ACCESS_KEY: ${ATRI_MINIO_ROOT_USER:-atri-minio}
      ATRI_OBJECT_STORAGE_SECRET_KEY: ${ATRI_MINIO_ROOT_PASSWORD:-AtriMinioLocalOnly123!}
      ATRI_OBJECT_STORAGE_BUCKET: ${ATRI_OBJECT_STORAGE_BUCKET:-atri-games}
      ATRI_OBJECT_STORAGE_PREFIX: ${ATRI_OBJECT_STORAGE_PREFIX:-assets}
      ATRI_OBJECT_STORAGE_USE_SSL: ${ATRI_OBJECT_STORAGE_USE_SSL:-false}
      ATRI_OBJECT_STORAGE_REGION: ${ATRI_OBJECT_STORAGE_REGION:-us-east-1}
      ATRI_OBJECT_STORAGE_SYNC_TIMEOUT_SECONDS: ${ATRI_OBJECT_STORAGE_SYNC_TIMEOUT_SECONDS:-600}
      ATRI_LOG_LEVEL: ${ATRI_LOG_LEVEL:-info}
      GOMAXPROCS: ${ATRI_GO_MAX_PROCS:-2}
      GOMEMLIMIT: ${ATRI_GO_MEMORY_LIMIT:-256MiB}
    volumes:
      - atri-data:/data
      - type: volume
        source: atri-assets
        target: /assets
        volume:
          nocopy: false
    networks:
      - backend
    depends_on:
      minio:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "1.5"
    mem_limit: 384m
    mem_reservation: 96m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:${ATRI_MINIO_IMAGE_TAG:-RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ATRI_MINIO_ROOT_USER:-atri-minio}
      MINIO_ROOT_PASSWORD: ${ATRI_MINIO_ROOT_PASSWORD:-AtriMinioLocalOnly123!}
    volumes:
      - minio-data:/data
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 96m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging

  web:
    image: atri-games-web:${ATRI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NODE_VERSION: ${NODE_VERSION:-22.14.0}
        CADDY_VERSION: ${CADDY_VERSION:-2.10.2}
        VITE_API_URL: /api/v1
    environment:
      ATRI_SITE_ADDRESS: ${ATRI_SITE_ADDRESS:-http://:8080}
      ATRI_AVATAR_MAX_SIZE: ${ATRI_AVATAR_MAX_SIZE:-3MB}
      ATRI_GAME_COVER_MAX_SIZE: ${ATRI_GAME_COVER_MAX_SIZE:-12MB}
      ATRI_GAME_PACKAGE_MAX_SIZE: ${ATRI_GAME_PACKAGE_MAX_SIZE:-513MB}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ATRI_HTTP_PORT:-80}:8080"
      - "${ATRI_HTTPS_PORT:-443}:8443"
      - "${ATRI_HTTPS_PORT:-443}:8443/udp"
    volumes:
      - type: volume
        source: atri-assets
        target: /assets
        read_only: true
        volume:
          nocopy: true
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    cpus: "0.75"
    mem_limit: 128m
    mem_reservation: 32m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  atri-data:
    name: ${ATRI_DATA_VOLUME:-atri-games-data}
  atri-assets:
    name: ${ATRI_ASSET_VOLUME:-atri-games-assets}
  caddy-data:
    name: ${ATRI_CADDY_DATA_VOLUME:-atri-games-caddy-data}
  caddy-config:
    name: ${ATRI_CADDY_CONFIG_VOLUME:-atri-games-caddy-config}
  minio-data:
    name: ${ATRI_MINIO_DATA_VOLUME:-atri-games-minio-data}
